@if (ui.loading()) {
  <div class="fixed inset-x-0 top-0 z-50 h-0.5 overflow-hidden bg-brand-100" role="progressbar" aria-label="Chargement">
    <div class="h-full w-1/3 animate-loading bg-brand-500"></div>
  </div>
}

<router-outlet />

@if (ui.toast(); as toast) {
  <div
    role="status"
    class="fixed bottom-6 left-1/2 z-50 flex max-w-[calc(100%-2rem)] -translate-x-1/2 animate-screen-in items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-white shadow-lg"
    [class]="toast.tone === 'error' ? 'bg-red-600' : 'bg-stone-900'"
  >
    @if (toast.tone === 'error') {
      <svg class="size-5 shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" /></svg>
    } @else {
      <svg class="size-5 shrink-0 text-brand-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" /></svg>
    }
    {{ toast.message }}
  </div>
}
